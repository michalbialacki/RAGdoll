services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ragdoll

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      - qdrant
    networks:
      - ragdoll

networks:
  ragdoll:

volumes:
  qdrant_data:
